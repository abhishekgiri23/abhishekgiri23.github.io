<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contraction Tracker UX</title>
    <style>
        :root {
            --primary: #7e22ce;
            --primary-light: #9333ea;
            --primary-bg: #f3e8ff;
            --text-dark: #1e1b4b;
            --text-muted: #6b7280;
            --active-red: #dc2626;
            --card-shadow: 0 10px 25px -5px rgba(126, 34, 206, 0.1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8fafc;
            color: var(--text-dark);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }

        .phone-frame {
            width: 100%;
            max-width: 412px;
            min-height: 100vh;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            position: relative;
            box-sizing: border-box;
            overflow-x: hidden;
            padding-bottom: 140px;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
        }
        .icon-btn {
            background: none;
            border: none;
            font-size: 1.2rem;
            color: #4b5563;
            cursor: pointer;
            padding: 6px;
        }
        .badge-practice {
            background: #1e293b;
            color: #ffffff;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.8px;
            padding: 4px 12px;
            border-radius: 20px;
            text-transform: uppercase;
        }

        /* Content Area */
        .content {
            padding: 0 20px;
        }

        /* Stats Card */
        .stats-card {
            background: linear-gradient(135deg, #7e22ce 0%, #6b21a8 100%);
            border-radius: 20px;
            padding: 20px 16px;
            color: white;
            box-shadow: var(--card-shadow);
        }
        .stats-header {
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: #e9d5ff;
            margin-bottom: 14px;
            text-transform: uppercase;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1.2fr 1.2fr;
            text-align: center;
            align-items: center;
        }
        .stat-col {
            border-right: 1px solid rgba(255, 255, 255, 0.15);
            padding: 0 4px;
        }
        .stat-col:last-child { border-right: none; }
        .stat-val {
            font-size: 1.45rem;
            font-weight: 800;
            line-height: 1.1;
        }
        .stat-lbl {
            font-size: 0.72rem;
            color: #e9d5ff;
            margin-top: 4px;
        }

        /* Insight Box */
        .insight-card {
            background: #fcf5ff;
            border: 1px solid #f3e8ff;
            border-radius: 14px;
            padding: 12px 16px;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #581c87;
        }
        .insight-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Section Header */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 24px 0 12px 0;
        }
        .section-title {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }
        .add-milestone-btn {
            background: #f1f5f9;
            border: none;
            color: #475569;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 8px 14px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Timeline */
        .timeline {
            position: relative;
            padding-left: 20px;
        }
        .timeline::before {
            content: '';
            position: absolute;
            left: 32px;
            top: 20px;
            bottom: 20px;
            width: 2px;
            background: #e2e8f0;
            z-index: 1;
        }
        .timeline-item {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            z-index: 2;
        }
        .timeline-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .badge-num {
            width: 26px;
            height: 26px;
            background: #e9d5ff;
            color: var(--primary);
            font-weight: 700;
            font-size: 0.75rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .time-start {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 500;
            width: 45px;
        }
        .duration-pill {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-dark);
        }
        .gap-pill {
            font-size: 0.8rem;
            color: #64748b;
            background: #f1f5f9;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 600;
        }

        /* Dome Bottom Action Controls */
        .action-dome-container {
            position: fixed;
            bottom: 0;
            width: 100%;
            max-width: 412px;
            height: 140px;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            z-index: 10;
        }

        .dome-bg {
            position: absolute;
            bottom: 0;
            width: 120%;
            height: 130px;
            background: linear-gradient(180deg, #9333ea 0%, #6b21a8 100%);
            border-top-left-radius: 50% 100%;
            border-top-right-radius: 50% 100%;
            box-shadow: 0 -8px 25px rgba(126, 34, 206, 0.3);
            pointer-events: auto;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
            user-select: none;
        }

        .dome-bg.active {
            background: linear-gradient(180deg, #ef4444 0%, #b91c1c 100%);
            box-shadow: 0 -8px 25px rgba(239, 68, 68, 0.4);
            animation: pulse-dome 2s infinite;
        }

        @keyframes pulse-dome {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        .dome-btn-label {
            color: white;
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            margin-top: 10px;
        }

        .active-timer-display {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 600;
            margin-top: 2px;
        }

        .help-btn {
            position: absolute;
            right: 24px;
            bottom: 16px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            pointer-events: auto;
        }
    </style>
</head>
<body>

<div class="phone-frame">
    <!-- Top Navigation Bar -->
    <div class="top-bar">
        <button class="icon-btn">⚙️</button>
        <span class="badge-practice">Practice Mode</span>
        <button class="icon-btn">📖</button>
    </div>

    <div class="content">
        <!-- Summary Card -->
        <div class="stats-card">
            <div class="stats-header">Last 60 Min Summary</div>
            <div class="stats-grid">
                <div class="stat-col">
                    <div class="stat-val" id="statCount">15</div>
                    <div class="stat-lbl">Contractions</div>
                </div>
                <div class="stat-col">
                    <div class="stat-val" id="statDuration">1m 33s</div>
                    <div class="stat-lbl">Ø Duration</div>
                </div>
                <div class="stat-col">
                    <div class="stat-val" id="statFrequency">3m 46s</div>
                    <div class="stat-lbl">Ø Frequency</div>
                </div>
            </div>
        </div>

        <!-- Dynamic Insight Pill -->
        <div class="insight-card">
            <div class="insight-left">
                <span>💡</span>
                <span id="insightText">Your logs show irregular contractions.</span>
            </div>
            <span>›</span>
        </div>

        <!-- Timeline Section Header -->
        <div class="section-header">
            <span class="section-title">Recent Timeline</span>
            <button class="add-milestone-btn"><span>+</span> Add Milestone</button>
        </div>

        <!-- Contraction Entry Timeline -->
        <div class="timeline" id="timelineList">
            <div class="timeline-item">
                <div class="timeline-left">
                    <div class="badge-num">304</div>
                    <div class="time-start">18:40</div>
                    <div class="duration-pill">2m 32s</div>
                </div>
                <div class="gap-pill">6m 28s</div>
            </div>

            <div class="timeline-item">
                <div class="timeline-left">
                    <div class="badge-num">303</div>
                    <div class="time-start">18:34</div>
                    <div class="duration-pill">2m 28s</div>
                </div>
                <div class="gap-pill">3m 23s</div>
            </div>

            <div class="timeline-item">
                <div class="timeline-left">
                    <div class="badge-num">302</div>
                    <div class="time-start">18:30</div>
                    <div class="duration-pill">1m 43s</div>
                </div>
                <div class="gap-pill">4m 52s</div>
            </div>
        </div>
    </div>

    <!-- Curved Bottom Start/Stop Area -->
    <div class="action-dome-container">
        <div class="dome-bg" id="domeTrigger">
            <div class="dome-btn-label" id="domeText">START</div>
            <div class="active-timer-display" id="activeTimer" style="display: none;">00:00</div>
        </div>
        <button class="help-btn">?</button>
    </div>
</div>

<script>
    let isActive = false;
    let startTime = null;
    let timerInterval = null;

    const domeTrigger = document.getElementById('domeTrigger');
    const domeText = document.getElementById('domeText');
    const activeTimer = document.getElementById('activeTimer');

    domeTrigger.addEventListener('click', () => {
        isActive = !isActive;

        if (isActive) {
            domeTrigger.classList.add('active');
            domeText.textContent = 'STOP';
            activeTimer.style.display = 'block';
            startTime = new Date();
            
            timerInterval = setInterval(() => {
                const elapsed = Math.floor((new Date() - startTime) / 1000);
                const mins = String(Math.floor(elapsed / 60)).padStart(2, '0');
                const secs = String(elapsed % 60).padStart(2, '0');
                activeTimer.textContent = `${mins}:${secs}`;
            }, 1000);
        } else {
            clearInterval(timerInterval);
            domeTrigger.classList.remove('active');
            domeText.textContent = 'START';
            activeTimer.style.display = 'none';
            activeTimer.textContent = '00:00';
        }
    });
</script>

</body>
</html>
